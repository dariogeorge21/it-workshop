<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Time</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="clock">
        <h2>Current Time: </h2>
        <br>
        <div id="time">
            <div id="hour"></div>
            <div id="minute"></div>
            <div id="second"></div>
            <div id="millisecond"></div>
        </div><br>
        <h2>Current Date: </h2>
        <br>
        <div id="date">
            <div id="day"></div>
            <div id="month"></div>
            <div id="year"></div>
            
        </div>
        <br>
    </div>
    <script src="script.js"></script>
</body>
</html>
